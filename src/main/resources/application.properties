spring.application.name=finmath-classroom
spring.main.banner-mode=off
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.tomcat.max-http-form-post-size=128KB
classroom.data=${CLASSROOM_DATA:}
classroom.public-url=${CLASSROOM_PUBLIC_URL:http://127.0.0.1:8080}
classroom.github-token=${CLASSROOM_GITHUB_TOKEN:}
classroom.github-client-id=${CLASSROOM_GITHUB_CLIENT_ID:}
classroom.github-client-secret=${CLASSROOM_GITHUB_CLIENT_SECRET:}
classroom.moodle.issuer=${CLASSROOM_MOODLE_ISSUER:}
classroom.moodle.client-id=${CLASSROOM_MOODLE_CLIENT_ID:}
classroom.moodle.deployment-id=${CLASSROOM_MOODLE_DEPLOYMENT_ID:}
classroom.moodle.auth-url=${CLASSROOM_MOODLE_AUTH_URL:}
classroom.moodle.jwks-url=${CLASSROOM_MOODLE_JWKS_URL:}
